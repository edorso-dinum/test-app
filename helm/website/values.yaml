replicaCount: 1

image:
  repository: docker.io/heroinedor/test-app-website
  pullPolicy: IfNotPresent
  tag: "0.3"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /
    port: 8000
  initialDelaySeconds: 2
  periodSeconds: 5

nodeSelector: {}

tolerations: []

affinity: {}

django:
  # DJANGO_ALLOWED_HOSTS
  allowedHosts: "*"
  # DJANGO_DEBUG
  debug: true
  # Name of a pre-existing Secret holding the Django SECRET_KEY. Leave empty to use the built-in default.
  secretKeyExistingSecret: ""
  secretKeyExistingSecretKey: "django-secret-key"

# Connection info for the two databases hosted by the (already deployed) CNPG cluster.
# `existingSecret` is expected to be a CNPG-generated "app" Secret, exposing the
# standard keys: host, port, dbname, user, password.
postgresql:
  host: "cnpg-cluster-tchap-pgbench-rw.tchap-pgbench.svc"
  port: 5432
  premierRoles:
    roleExistingSecret: "tchap-pgbench-stars-secret"
    dbName: "stars"
  doublures:
    roleExistingSecret: "tchap-pgbench-doublures-secret"
    dbName: "doublures"
