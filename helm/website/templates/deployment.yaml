apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "website.fullname" . }}
  namespace: {{ include "website.namespace" . | quote }}
  labels:
    {{- include "website.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "website.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "website.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $dbEnv := list
            (dict "name" "PREMIER_ROLES_DB_NAME" "value" .Values.postgresql.premierRoles.dbName)
            (dict "name" "PREMIER_ROLES_DB_USER" "secretName" .Values.postgresql.premierRoles.roleExistingSecret "secretKey" "username")
            (dict "name" "PREMIER_ROLES_DB_PASSWORD" "secretName" .Values.postgresql.premierRoles.roleExistingSecret "secretKey" "password")
            (dict "name" "PREMIER_ROLES_DB_HOST" "value" .Values.postgresql.host)
            (dict "name" "PREMIER_ROLES_DB_PORT" "value" (.Values.postgresql.port | toString))
            (dict "name" "DOUBLURES_DB_NAME" "value" .Values.postgresql.doublures.dbName)
            (dict "name" "DOUBLURES_DB_USER" "secretName" .Values.postgresql.doublures.roleExistingSecret "secretKey" "username")
            (dict "name" "DOUBLURES_DB_PASSWORD" "secretName" .Values.postgresql.doublures.roleExistingSecret "secretKey" "password")
            (dict "name" "DOUBLURES_DB_HOST" "value" .Values.postgresql.host)
            (dict "name" "DOUBLURES_DB_PORT" "value" (.Values.postgresql.port | toString))
      }}
      initContainers:
        - name: migrate-premier-roles
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--database=premier_roles", "--noinput"]
          env:
            {{- range $dbEnv }}
            - name: {{ .name }}
              {{- if .secretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
              {{- else }}
              value: {{ .value | quote }}
              {{- end }}
            {{- end }}
        - name: migrate-doublures
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--database=doublures", "--noinput"]
          env:
            {{- range $dbEnv }}
            - name: {{ .name }}
              {{- if .secretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
              {{- else }}
              value: {{ .value | quote }}
              {{- end }}
            {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default .Values.service.port }}
              protocol: TCP
          env:
            - name: DJANGO_ALLOWED_HOSTS
              value: {{ .Values.django.allowedHosts | quote }}
            - name: DJANGO_DEBUG
              value: {{ .Values.django.debug | quote }}
            {{- if .Values.django.secretKeyExistingSecret }}
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.django.secretKeyExistingSecret }}
                  key: {{ .Values.django.secretKeyExistingSecretKey }}
            {{- end }}
            {{- range $dbEnv }}
            - name: {{ .name }}
              {{- if .secretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
              {{- else }}
              value: {{ .value | quote }}
              {{- end }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
